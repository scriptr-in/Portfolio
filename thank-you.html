<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — scriptr.</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0D0D00; --cream:#F8F8F8; --orange:#CC5500; --orange-bright:#FF6B1A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:var(--ink); color:var(--cream); font-family:'DM Sans',sans-serif; display:flex; align-items:center; justify-content:center; padding:40px; }
  main { max-width:760px; text-align:center; border:1px solid rgba(204,85,0,.25); padding:70px 44px; }
  .logo { font-family:'Playfair Display',serif; font-size:2rem; font-weight:900; margin-bottom:34px; }
  .logo span { color:var(--orange); }
  .eyebrow { font-family:'Space Mono',monospace; color:var(--orange); letter-spacing:.22em; text-transform:uppercase; font-size:.7rem; margin-bottom:18px; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(2.4rem,6vw,5rem); line-height:.95; margin-bottom:22px; }
  p { color:rgba(248,248,248,.62); line-height:1.7; max-width:560px; margin:0 auto 34px; }
  a { display:inline-block; background:var(--orange); color:var(--ink); text-decoration:none; padding:15px 28px; font-family:'Space Mono',monospace; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; }
  a:hover { background:var(--orange-bright); }
</style>
</head>
<body>
<main>
  <div class="logo">scriptr<span>.</span></div>
  <div class="eyebrow">Brief Received</div>
  <h1>Thank you.</h1>
  <p>Your message has been submitted. We’ll review the brief and get back to you soon.</p>
  <a href="/">Back to Home</a>
</main>
</body>
</html>
